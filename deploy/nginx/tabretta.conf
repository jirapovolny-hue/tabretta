# Návrh pro správce: /etc/nginx/sites-available/tabretta.blbadomena.cz
# Aktivace symlinkem do sites-enabled, `nginx -t`, reload. HTTPS doplní
# `certbot --nginx -d tabretta.blbadomena.cz` (přidá listen 443 a přesměrování z 80).
# Přílohy se nikdy nepodávají přímo z disku, jen přes aplikaci (kontrola vlastníka).

server {
    listen 80;
    listen [::]:80;
    server_name tabretta.blbadomena.cz;

    # Limit aplikace je 25 MB na soubor; rezerva na multipart obálku.
    client_max_body_size 30m;

    access_log /var/log/nginx/tabretta.access.log;
    error_log  /var/log/nginx/tabretta.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Nahrávání větších souborů z mobilu může chvíli trvat.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
